<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillSwap - Sign In to Your Studio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px; background: radial-gradient(circle at 50% 20%, rgba(224, 122, 95, 0.05) 0%, transparent 60%), var(--ground);">

  <div style="max-width: 460px; width: 100%;">
    <!-- Brand Mark Header -->
    <div style="text-align: center; margin-bottom: 28px;">
      <a href="index.html" class="brand" style="justify-content: center; margin-bottom: 16px; text-decoration: none;">
        <div class="brand-icon" style="animation: knotPulse 4s infinite ease-in-out;">⇄</div>
        <span class="brand-name" style="font-size: 20px;">Skill<span>Swap</span></span>
      </a>
      <h1 style="font-family: var(--font-serif); font-size: 32px; font-weight: 400; letter-spacing: -0.02em; margin-bottom: 8px;">
        Return to the <em>Barter Studio</em>
      </h1>
      <p style="color: var(--text-muted); font-size: 14px; line-height: 1.5;">
        Continue exchanging craft, conducting 1-on-1 sessions, and building reciprocal reputation.
      </p>
    </div>

    <!-- Login Card -->
    <div class="card" style="margin-bottom: 20px; padding: 28px;">
      <form id="loginForm">
        <div class="input-group">
          <label class="input-label" for="loginEmail">Email Address</label>
          <input type="email" id="loginEmail" class="input-text" placeholder="name@example.com" required autocomplete="email">
        </div>

        <div class="input-group">
          <label class="input-label" for="loginPassword">Password</label>
          <input type="password" id="loginPassword" class="input-text" placeholder="Enter your password" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px; padding: 12px;">
          Sign In to Account
        </button>
      </form>
    </div>

    <!-- Curated Demo Practitioners Roster -->
    <div class="card" style="background-color: var(--surface-raised); border-color: rgba(255,255,255,0.06); padding: 20px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <span style="font-size: 11px; font-weight: 700; color: var(--accent-seek); text-transform: uppercase; letter-spacing: 0.08em; font-family: var(--font-mono);">
          1-Click Demo Profiles
        </span>
        <span style="font-size: 11px; color: var(--text-faint);">Instant login</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px;" id="demoList">
        <button class="btn btn-secondary btn-sm demo-btn" data-email="alex@example.com" data-pass="password123" style="justify-content: flex-start; text-align: left; padding: 10px 12px;">
          <span style="color: var(--accent-give); font-size: 13px;">●</span>
          <span style="flex: 1; font-size: 13px;"><strong>Alex Chen</strong> &bull; Systems (Python, React)</span>
        </button>
        <button class="btn btn-secondary btn-sm demo-btn" data-email="elena@example.com" data-pass="password123" style="justify-content: flex-start; text-align: left; padding: 10px 12px;">
          <span style="color: var(--accent-seek); font-size: 13px;">●</span>
          <span style="flex: 1; font-size: 13px;"><strong>Elena Rostova</strong> &bull; Music (Guitar, Spanish)</span>
        </button>
        <button class="btn btn-secondary btn-sm demo-btn" data-email="marcus@example.com" data-pass="password123" style="justify-content: flex-start; text-align: left; padding: 10px 12px;">
          <span style="color: var(--coin-gold); font-size: 13px;">●</span>
          <span style="flex: 1; font-size: 13px;"><strong>Marcus Vance</strong> &bull; Design (Figma, Brand)</span>
        </button>
        <button class="btn btn-secondary btn-sm demo-btn" data-email="admin@skillswap.com" data-pass="adminpassword" style="justify-content: flex-start; text-align: left; padding: 10px 12px;">
          <span style="color: var(--accent-mutual); font-size: 13px;">●</span>
          <span style="flex: 1; font-size: 13px;"><strong>Platform Admin</strong> &bull; Protocol Oversight</span>
        </button>
      </div>
    </div>

    <div style="text-align: center; margin-top: 24px; font-size: 13.5px; color: var(--text-muted);">
      New to peer skill exchange? <a href="register.html" style="color: var(--accent-seek); font-weight: 600; text-decoration: underline; text-underline-offset: 3px;">Register account &rarr;</a>
    </div>
  </div>

  <script src="storage.js"></script>
  <script src="engine.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById("loginForm");
      const emailInput = document.getElementById("loginEmail");
      const passInput = document.getElementById("loginPassword");

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        try {
          window.SkillSwapEngine.login(emailInput.value.trim(), passInput.value);
          window.showToast("Welcome back! Signed in successfully.", "success");
          setTimeout(() => {
            window.location.href = "dashboard.html";
          }, 300);
        } catch (err) {
          window.showToast(err.message, "error");
        }
      });

      document.querySelectorAll(".demo-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          emailInput.value = btn.getAttribute("data-email");
          passInput.value = btn.getAttribute("data-pass");
          form.dispatchEvent(new Event("submit"));
        });
      });
    });
  </script>
</body>
</html>
