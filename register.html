<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillSwap - Join the Reciprocal Network</title>
  <link rel="stylesheet" href="style.css">
</head>
<body style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px; background: radial-gradient(circle at 50% 20%, rgba(56, 189, 248, 0.05) 0%, transparent 60%), var(--ground);">

  <div style="max-width: 500px; width: 100%;">
    <!-- Brand Mark Header -->
    <div style="text-align: center; margin-bottom: 28px;">
      <a href="index.html" class="brand" style="justify-content: center; margin-bottom: 16px; text-decoration: none;">
        <div class="brand-icon" style="animation: knotPulse 4s infinite ease-in-out;">⇄</div>
        <span class="brand-name" style="font-size: 20px;">Skill<span>Swap</span></span>
      </a>
      <h1 style="font-family: var(--font-serif); font-size: 32px; font-weight: 400; letter-spacing: -0.02em; margin-bottom: 8px;">
        Join the <em>Reciprocal Network</em>
      </h1>
      <p style="color: var(--text-muted); font-size: 14px; line-height: 1.5;">
        Pass craft between peers. Everyone teaches what they know and learns what they desire.
      </p>
    </div>

    <!-- Onboarding Incentive Pill -->
    <div class="card" style="margin-bottom: 20px; padding: 14px 18px; background: rgba(251, 191, 36, 0.08); border-color: rgba(251, 191, 36, 0.25); display: flex; align-items: center; gap: 12px;">
      <span style="font-size: 22px;">🪙</span>
      <div style="font-size: 13px; color: var(--text);">
        <strong style="color: var(--coin-gold);">+100 Skill Coins Welcome Grant:</strong> Automatically credited to your bilateral balance on signup.
      </div>
    </div>

    <!-- Registration Card -->
    <div class="card" style="padding: 28px;">
      <form id="registerForm">
        <div class="input-group">
          <label class="input-label" for="regName">Full Name</label>
          <input type="text" id="regName" class="input-text" placeholder="e.g. Maya Lin" required autocomplete="name">
        </div>

        <div class="input-group">
          <label class="input-label" for="regEmail">Email Address</label>
          <input type="email" id="regEmail" class="input-text" placeholder="maya@example.com" required autocomplete="email">
        </div>

        <div class="input-group">
          <label class="input-label" for="regPassword">Password (Minimum 6 characters)</label>
          <input type="password" id="regPassword" class="input-text" placeholder="Create a secure passphrase" minlength="6" required autocomplete="new-password">
        </div>

        <div class="input-group">
          <label class="input-label" for="regTimezone">Scheduling Timezone</label>
          <select id="regTimezone" class="input-select" required>
            <option value="UTC-5 (Eastern Time)">UTC-5 (Eastern Time)</option>
            <option value="UTC-6 (Central Time)">UTC-6 (Central Time)</option>
            <option value="UTC-7 (Mountain Time)">UTC-7 (Mountain Time)</option>
            <option value="UTC-8 (Pacific Time)">UTC-8 (Pacific Time)</option>
            <option value="UTC+0 (GMT/UTC)">UTC+0 (GMT/UTC)</option>
            <option value="UTC+1 (Central European Time)">UTC+1 (Central European Time)</option>
            <option value="UTC+5:30 (India Standard Time)">UTC+5:30 (India Standard Time)</option>
            <option value="UTC+8 (Singapore/Perth)">UTC+8 (Singapore/Perth)</option>
          </select>
        </div>

        <div class="input-group">
          <label class="input-label" for="regBio">Teaching Cadence &amp; Learning Goals</label>
          <textarea id="regBio" class="input-textarea" rows="2" placeholder="What craft do you feel comfortable sharing, and what are you excited to explore?"></textarea>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px; padding: 12px;">
          Create Practitioner Account &amp; Claim Coins &rarr;
        </button>
      </form>
    </div>

    <div style="text-align: center; margin-top: 24px; font-size: 13.5px; color: var(--text-muted);">
      Already a member? <a href="login.html" style="color: var(--accent-seek); font-weight: 600; text-decoration: underline; text-underline-offset: 3px;">Sign in to your studio &rarr;</a>
    </div>
  </div>

  <script src="storage.js"></script>
  <script src="engine.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById("registerForm");

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const name = document.getElementById("regName").value.trim();
        const email = document.getElementById("regEmail").value.trim();
        const pass = document.getElementById("regPassword").value;
        const tz = document.getElementById("regTimezone").value;
        const bio = document.getElementById("regBio").value.trim();

        try {
          window.SkillSwapEngine.register(name, email, pass, bio, tz);
          window.showToast("Account created! +100 Skill Coins credited. Welcome to SkillSwap.", "success");
          setTimeout(() => {
            window.location.href = "skills.html";
          }, 400);
        } catch (err) {
          window.showToast(err.message, "error");
        }
      });
    });
  </script>
</body>
</html>
