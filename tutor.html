<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillSwap - Member Detail</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="main-content">
    <div style="margin-bottom: 20px;">
      <a href="find-tutor.html" class="btn btn-secondary btn-sm">&larr; Back to Matches</a>
    </div>

    <div class="card" id="memberDetailCard" style="max-width: 680px; margin: 0 auto;">
      <!-- Populated dynamically -->
    </div>
  </main>

  <script src="storage.js"></script>
  <script src="engine.js"></script>
  <script src="nav.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      const userId = urlParams.get("id") || localStorage.getItem("selectedTutorId") || "usr_elena";

      const user = window.SkillSwapStorage.getUserById(userId);
      const card = document.getElementById("memberDetailCard");

      if (!user) {
        card.innerHTML = `<p style="color: var(--text-muted); text-align: center;">Member not found. <a href="find-tutor.html" style="color: var(--primary);">Return to matches</a>.</p>`;
        return;
      }

      const userSkills = window.SkillSwapStorage.getUserSkills(user.id);
      const offers = userSkills.filter(s => s.type === "OFFER");
      const wants = userSkills.filter(s => s.type === "WANT");

      card.innerHTML = `
        <div style="display: flex; align-items: center; gap: 16px; margin-bottom: 20px;">
          <div class="user-avatar" style="width: 56px; height: 56px; font-size: 20px; background-color: ${user.avatarColor};">
            ${user.name.split(" ").map(n => n[0]).join("")}
          </div>
          <div>
            <h1 style="font-size: 20px; font-weight: 700;">${user.name}</h1>
            <div style="font-size: 13px; color: var(--text-faint); margin-top: 2px;">
              ${user.timezone} &bull; Rating: ${user.reputation} / 5.0 (${user.sessionsCompleted} completed sessions)
            </div>
          </div>
        </div>

        <p style="font-size: 14px; color: var(--text-muted); line-height: 1.6; margin-bottom: 24px;">
          ${user.bio || 'Community peer mentor on SkillSwap.'}
        </p>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px;">
          <div style="background-color: var(--ground); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 14px;">
            <div style="font-size: 12px; font-weight: 700; color: var(--accent-light); margin-bottom: 8px; text-transform: uppercase;">
              Skills Offered
            </div>
            <div style="display: flex; flex-direction: column; gap: 6px;">
              ${offers.map(s => `
                <div style="font-size: 13px;">• <strong>${s.skillName}</strong> <span style="color: var(--text-faint); font-size: 11.5px;">(${s.proficiency})</span></div>
              `).join('') || '<span style="color:var(--text-faint);">None listed</span>'}
            </div>
          </div>

          <div style="background-color: var(--ground); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 14px;">
            <div style="font-size: 12px; font-weight: 700; color: var(--primary); margin-bottom: 8px; text-transform: uppercase;">
              Skills Wanted
            </div>
            <div style="display: flex; flex-direction: column; gap: 6px;">
              ${wants.map(s => `
                <div style="font-size: 13px;">• <strong>${s.skillName}</strong> <span style="color: var(--text-faint); font-size: 11.5px;">(${s.proficiency})</span></div>
              `).join('') || '<span style="color:var(--text-faint);">None listed</span>'}
            </div>
          </div>
        </div>

        <a href="find-tutor.html" class="btn btn-primary" style="width: 100%;">
          View in Bidirectional Matches &rarr;
        </a>
      `;
    });
  </script>
</body>
</html>
